<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="Lumina 4K Ultra-HD Waterproof Action Camera">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#BAE6FD"/>
    </linearGradient>
    <linearGradient id="camBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <radialGradient id="lensGlass" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="35%" stop-color="#1E3A8A"/>
      <stop offset="85%" stop-color="#0B132B"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <filter id="shadow3" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg3)"/>
  <!-- Splash / Waves decorative -->
  <path d="M 60 220 Q 120 180 200 220 T 340 220" fill="none" stroke="#0284C7" stroke-width="2" opacity="0.25"/>
  <path d="M 40 240 Q 140 200 220 240 T 360 240" fill="none" stroke="#0284C7" stroke-width="1.5" opacity="0.2"/>
  <!-- Action Cam Group -->
  <g filter="url(#shadow3)">
    <!-- Rugged Camera Body -->
    <rect x="100" y="80" width="200" height="150" rx="24" fill="url(#camBody)" stroke="#475569" stroke-width="3"/>
    <!-- Top Shutter Button (Red) -->
    <rect x="130" y="68" width="40" height="12" rx="4" fill="#EF4444" stroke="#DC2626" stroke-width="1.5"/>
    <!-- Power / Mode Button -->
    <rect x="230" y="68" width="30" height="12" rx="4" fill="#64748B"/>
    <!-- Lens Housing (Left) -->
    <circle cx="170" cy="155" r="54" fill="#1E293B" stroke="#64748B" stroke-width="4"/>
    <circle cx="170" cy="155" r="44" fill="#0F172A"/>
    <circle cx="170" cy="155" r="38" fill="url(#lensGlass)"/>
    <!-- Lens Reflection -->
    <ellipse cx="156" cy="142" rx="14" ry="7" fill="#FFFFFF" opacity="0.4" transform="rotate(-30 156 142)"/>
    <!-- Front Display Screen (Right) -->
    <rect x="238" y="125" width="48" height="58" rx="6" fill="#0284C7" opacity="0.9" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="262" y="148" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle">4K</text>
    <text x="262" y="164" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#E0F2FE" text-anchor="middle">60FPS</text>
    <circle cx="274" cy="132" r="3" fill="#EF4444"/>
    <!-- Corner Grips -->
    <rect x="105" y="85" width="8" height="14" rx="2" fill="#64748B"/>
    <rect x="105" y="210" width="8" height="14" rx="2" fill="#64748B"/>
  </g>
  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#0369A1" text-anchor="middle" letter-spacing="1">4K/60FPS • WATERPROOF 30M • EIS 3.0</text>
</svg>
