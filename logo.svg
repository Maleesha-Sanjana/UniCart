<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" role="img" aria-label="UniCart Logo">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="cartGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4F46E5" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Shopping Cart Icon with Universal Sphere -->
  <g transform="translate(10, 8)" filter="url(#glow)">
    <circle cx="22" cy="22" r="20" fill="url(#logoGrad)" />
    <!-- Modern Cart Path -->
    <path d="M12 15 h4 l3 11 h11 l2.5 -8 h-18" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="30" r="2.2" fill="#FFFFFF"/>
    <circle cx="28" cy="30" r="2.2" fill="#FFFFFF"/>
    <!-- Universal Accessibility Dot / Star -->
    <circle cx="29" cy="12" r="3.5" fill="#F59E0B" stroke="#FFFFFF" stroke-width="1.5"/>
  </g>
  <!-- Text Brand -->
  <text x="62" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="28" fill="#1E293B" letter-spacing="-0.5">
    Uni<tspan fill="url(#logoGrad)">Cart</tspan>
  </text>
  <!-- Sub-caption -->
  <text x="64" y="49" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="9" fill="#64748B" letter-spacing="1.2">
    UNIVERSAL E-COMMERCE
  </text>
</svg>
