<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="Cold-Pressed Extra Virgin Estate Olive Oil">
  <defs>
    <linearGradient id="bg10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FEE7"/>
      <stop offset="100%" stop-color="#ECFCCB"/>
    </linearGradient>
    <linearGradient id="bottleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="40%" stop-color="#166534"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="goldCap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <filter id="shadow10" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#052E16" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg10)"/>
  <!-- Olive Branch leaves decor -->
  <g transform="translate(60, 100) rotate(-20)" opacity="0.3">
    <path d="M 0 0 Q 30 -10 60 0" fill="none" stroke="#4D7C0F" stroke-width="2"/>
    <ellipse cx="20" cy="-8" rx="8" ry="4" fill="#65A30D" transform="rotate(-30 20 -8)"/>
    <ellipse cx="40" cy="-6" rx="8" ry="4" fill="#65A30D" transform="rotate(25 40 -6)"/>
    <circle cx="28" cy="2" r="4.5" fill="#1E293B"/>
  </g>
  <g transform="translate(300, 190) rotate(15)" opacity="0.3">
    <path d="M 0 0 Q 30 -10 60 0" fill="none" stroke="#4D7C0F" stroke-width="2"/>
    <ellipse cx="20" cy="-8" rx="8" ry="4" fill="#65A30D" transform="rotate(-30 20 -8)"/>
    <ellipse cx="40" cy="-6" rx="8" ry="4" fill="#65A30D" transform="rotate(25 40 -6)"/>
    <circle cx="30" cy="2" r="4.5" fill="#1E293B"/>
  </g>
  <!-- Olive Oil Bottle -->
  <g filter="url(#shadow10)">
    <!-- Gold Cap & Foil -->
    <rect x="188" y="42" width="24" height="24" rx="2" fill="url(#goldCap)" stroke="#78350F" stroke-width="1"/>
    <!-- Bottle Neck -->
    <rect x="190" y="66" width="20" height="40" fill="url(#bottleGrad)" stroke="#14532D" stroke-width="1.5"/>
    <!-- Bottle Shoulder & Main Body -->
    <path d="M 190 106 
             C 170 120, 160 135, 160 160 
             L 160 250 
             L 240 250 
             L 240 160 
             C 240 135, 230 120, 210 106 Z" 
          fill="url(#bottleGrad)" stroke="#14532D" stroke-width="2"/>
    <!-- Dark Glass Specular Highlight -->
    <path d="M 168 150 L 168 242" stroke="#FFFFFF" stroke-width="2" opacity="0.3" stroke-linecap="round"/>
    <!-- Elegant Gold-Foil Border Label -->
    <rect x="168" y="145" width="64" height="85" rx="4" fill="#FFFBEB" stroke="#B45309" stroke-width="1.5"/>
    <rect x="171" y="148" width="58" height="79" rx="2" fill="none" stroke="#D97706" stroke-width="0.8"/>
    <!-- Label Typography -->
    <text x="200" y="162" font-family="serif" font-weight="700" font-size="8" fill="#78350F" text-anchor="middle" letter-spacing="1">TENUTA D'ORO</text>
    <circle cx="200" cy="172" r="6" fill="#65A30D"/>
    <circle cx="200" cy="172" r="2" fill="#FEF08A"/>
    <text x="200" y="188" font-family="system-ui, sans-serif" font-weight="900" font-size="9" fill="#14532D" text-anchor="middle">EXTRA VIRGIN</text>
    <text x="200" y="198" font-family="system-ui, sans-serif" font-weight="700" font-size="7.5" fill="#65A30D" text-anchor="middle">OLIVE OIL</text>
    <line x1="178" y1="204" x2="222" y2="204" stroke="#D97706" stroke-width="0.8"/>
    <text x="200" y="214" font-family="system-ui, sans-serif" font-weight="600" font-size="6.5" fill="#78350F" text-anchor="middle">COLD PRESSED • 750 ML</text>
    <text x="200" y="222" font-family="system-ui, sans-serif" font-weight="700" font-size="6" fill="#15803D" text-anchor="middle">ACIDITY &lt; 0.2%</text>
  </g>
  <text x="200" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#3F6212" text-anchor="middle" letter-spacing="1">TUSCAN ESTATE • FIRST COLD EXTRACTION • HIGH POLYPHENOL</text>
</svg>
