<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="PulseFit Ultra GPS Smartwatch Series 7">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDF4"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="caseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748B"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <filter id="shadow2" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0F172A" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg2)"/>
  <circle cx="200" cy="160" r="115" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.4"/>
  <!-- Smartwatch -->
  <g filter="url(#shadow2)">
    <!-- Top Strap -->
    <path d="M 160 30 L 240 30 L 230 100 L 170 100 Z" fill="url(#strapGrad)"/>
    <rect x="175" y="45" width="50" height="6" rx="3" fill="#475569"/>
    <rect x="175" y="60" width="50" height="6" rx="3" fill="#475569"/>
    <!-- Bottom Strap -->
    <path d="M 170 220 L 230 220 L 240 290 L 160 290 Z" fill="url(#strapGrad)"/>
    <rect x="180" y="240" width="40" height="6" rx="3" fill="#475569"/>
    <rect x="180" y="255" width="40" height="6" rx="3" fill="#475569"/>
    <!-- Watch Case -->
    <rect x="145" y="95" width="110" height="130" rx="28" fill="url(#caseGrad)" stroke="#94A3B8" stroke-width="2"/>
    <!-- Digital Crown -->
    <rect x="256" y="125" width="8" height="26" rx="3" fill="#94A3B8"/>
    <!-- Screen -->
    <rect x="153" y="103" width="94" height="114" rx="22" fill="url(#screenGrad)"/>
    <!-- Watch UI: Time -->
    <text x="200" y="145" font-family="system-ui, sans-serif" font-weight="800" font-size="28" fill="#FFFFFF" text-anchor="middle">10:42</text>
    <text x="200" y="160" font-family="system-ui, sans-serif" font-weight="600" font-size="10" fill="#94A3B8" text-anchor="middle">WED, OCT 28</text>
    <!-- Heart Rate & Pulse line -->
    <path d="M 165 185 L 178 185 L 183 175 L 189 195 L 195 180 L 202 188 L 235 188" fill="none" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Metrics -->
    <circle cx="178" cy="204" r="3" fill="#22C55E"/>
    <text x="186" y="207" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#22C55E">8,420</text>
    <circle cx="214" cy="204" r="3" fill="#3B82F6"/>
    <text x="222" y="207" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#38BDF8">74 bpm</text>
  </g>
  <text x="200" y="306" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#15803D" text-anchor="middle" letter-spacing="1">AMOLED • ECG • GPS</text>
</svg>
