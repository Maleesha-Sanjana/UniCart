<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="Merino Wool Thermal Crewneck Sweater">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="sweaterGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <pattern id="knitPattern" width="16" height="16" patternUnits="userSpaceOnUse">
      <path d="M 0 8 Q 4 2, 8 8 T 16 8" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.3"/>
      <path d="M 0 16 Q 4 10, 8 16 T 16 16" fill="none" stroke="#475569" stroke-width="1.2" opacity="0.3"/>
    </pattern>
    <filter id="shadow5" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg5)"/>
  <!-- Decorative Wool Fiber circles -->
  <circle cx="90" cy="80" r="45" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="3 5" opacity="0.4"/>
  <circle cx="320" cy="230" r="55" fill="none" stroke="#94A3B8" stroke-width="1" stroke-dasharray="4 6" opacity="0.3"/>
  <!-- Sweater Silhouette -->
  <g filter="url(#shadow5)">
    <!-- Base Sweater Body & Sleeves -->
    <path d="M 140 70 
             L 100 95 L 60 170 L 95 190 L 120 145 
             L 120 240 L 280 240 
             L 280 145 L 305 190 L 340 170 L 300 95 
             L 260 70 
             Q 200 100 140 70 Z" 
          fill="url(#sweaterGrad)" stroke="#475569" stroke-width="2"/>
    <!-- Knit texture overlay -->
    <path d="M 140 70 
             L 100 95 L 60 170 L 95 190 L 120 145 
             L 120 240 L 280 240 
             L 280 145 L 305 190 L 340 170 L 300 95 
             L 260 70 
             Q 200 100 140 70 Z" 
          fill="url(#knitPattern)"/>
    <!-- Ribbed Collar -->
    <path d="M 150 72 Q 200 102 250 72 Q 200 88 150 72 Z" fill="#475569" stroke="#64748B" stroke-width="1"/>
    <!-- Ribbed Cuffs -->
    <rect x="62" y="172" width="34" height="15" rx="3" fill="#475569" transform="rotate(30 79 180)"/>
    <rect x="304" y="172" width="34" height="15" rx="3" fill="#475569" transform="rotate(-30 321 180)"/>
    <!-- Ribbed Bottom Hem -->
    <rect x="120" y="230" width="160" height="15" rx="2" fill="#475569"/>
    <!-- Eco Wool Emblem / Tag -->
    <circle cx="160" cy="140" r="14" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <path d="M 155 142 C 155 136, 165 136, 165 142 C 165 146, 155 146, 155 142 Z" fill="none" stroke="#10B981" stroke-width="1.8"/>
  </g>
  <text x="200" y="282" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#475569" text-anchor="middle" letter-spacing="1">100% MERINO WOOL • THERMOREGULATING • BREATHABLE</text>
</svg>
