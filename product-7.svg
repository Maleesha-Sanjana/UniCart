<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="UrbanFlex Ergonomic Active Stretch Joggers">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="joggerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="60%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <filter id="shadow7" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#1E293B" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg7)"/>
  <!-- Decorative Stretch Arrows -->
  <path d="M 100 160 L 70 160 M 78 155 L 70 160 L 78 165" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <path d="M 300 160 L 330 160 M 322 155 L 330 160 L 322 165" stroke="#94A3B8" stroke-width="2" stroke-linecap="round"/>
  <!-- Joggers Pants Silhouette -->
  <g filter="url(#shadow7)">
    <!-- Waistband -->
    <rect x="140" y="55" width="120" height="18" rx="4" fill="#1E293B" stroke="#64748B" stroke-width="1.5"/>
    <!-- Drawstring -->
    <path d="M 195 68 Q 190 90 188 100" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 205 68 Q 210 90 212 100" fill="none" stroke="#F8FAFC" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="188" cy="100" r="2.5" fill="#F59E0B"/>
    <circle cx="212" cy="100" r="2.5" fill="#F59E0B"/>
    <!-- Main Legs -->
    <path d="M 140 73 
             L 132 150 L 145 240 L 175 240 L 195 130 
             L 205 130 L 225 240 L 255 240 L 268 150 
             L 260 73 Z" 
          fill="url(#joggerGrad)" stroke="#334155" stroke-width="2"/>
    <!-- Articulated Knee Seams -->
    <path d="M 137 170 Q 155 165 174 172" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M 139 180 Q 155 175 172 182" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M 226 172 Q 245 165 263 170" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <path d="M 228 182 Q 245 175 261 180" fill="none" stroke="#64748B" stroke-width="1.5"/>
    <!-- Zipper Pocket on Right Hip -->
    <line x1="245" y1="95" x2="255" y2="120" stroke="#0EA5E9" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Ribbed Ankle Cuffs -->
    <rect x="145" y="240" width="30" height="12" rx="2" fill="#1E293B"/>
    <rect x="225" y="240" width="30" height="12" rx="2" fill="#1E293B"/>
  </g>
  <text x="200" y="285" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#334155" text-anchor="middle" letter-spacing="1">4-WAY STRETCH • ZIPPER SECURITY POCKETS • QUICK-DRY</text>
</svg>
