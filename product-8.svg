<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="Artisan Single-Origin Arabica Coffee Beans">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="bagGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="50%" stop-color="#5B21B6"/>
      <stop offset="100%" stop-color="#3B0764"/>
    </linearGradient>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#92400E"/>
    </linearGradient>
    <linearGradient id="beanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451A03"/>
      <stop offset="100%" stop-color="#1C0A00"/>
    </linearGradient>
    <filter id="shadow8" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#451A03" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg8)"/>
  <!-- Aroma Steam curves -->
  <path d="M 185 45 Q 175 30 185 15" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <path d="M 200 42 Q 210 25 200 10" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" opacity="0.5"/>
  <path d="M 215 45 Q 225 30 215 15" fill="none" stroke="#B45309" stroke-width="2.5" stroke-linecap="round" opacity="0.4"/>
  <!-- Coffee Bag -->
  <g filter="url(#shadow8)">
    <!-- Top Fold & Tin Tie -->
    <path d="M 145 60 L 255 60 L 250 80 L 150 80 Z" fill="#92400E"/>
    <rect x="140" y="55" width="120" height="8" rx="2" fill="#F59E0B"/>
    <!-- Bag Body -->
    <path d="M 148 80 L 252 80 L 265 240 L 135 240 Z" fill="url(#kraftGrad)" stroke="#78350F" stroke-width="2"/>
    <!-- Aroma Valve circle -->
    <circle cx="200" cy="105" r="9" fill="#78350F" stroke="#FDE68A" stroke-width="1.5"/>
    <circle cx="197" cy="105" r="1.5" fill="#FDE68A"/>
    <circle cx="203" cy="105" r="1.5" fill="#FDE68A"/>
    <!-- Artisan Label Badge -->
    <rect x="155" y="125" width="90" height="95" rx="6" fill="#FFFBEB" stroke="#78350F" stroke-width="1.5"/>
    <text x="200" y="145" font-family="system-ui, sans-serif" font-weight="900" font-size="10" fill="#92400E" text-anchor="middle" letter-spacing="1">ORIGIN ROAST</text>
    <line x1="165" y1="152" x2="235" y2="152" stroke="#D97706" stroke-width="1"/>
    <text x="200" y="170" font-family="serif" font-weight="700" font-size="14" fill="#451A03" text-anchor="middle">ARABICA</text>
    <text x="200" y="185" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#B45309" text-anchor="middle">FAIR TRADE • 1 KG</text>
    <text x="200" y="205" font-family="system-ui, sans-serif" font-weight="700" font-size="9" fill="#059669" text-anchor="middle">DARK CHOCOLATE</text>
    <!-- Coffee Beans Scattered at bottom -->
    <g transform="translate(115, 230)">
      <ellipse cx="15" cy="10" rx="9" ry="6" fill="url(#beanGrad)" transform="rotate(-25 15 10)"/>
      <path d="M 8 10 Q 15 11 22 10" stroke="#FDE68A" stroke-width="1.2" fill="none"/>
    </g>
    <g transform="translate(255, 230)">
      <ellipse cx="15" cy="10" rx="9" ry="6" fill="url(#beanGrad)" transform="rotate(20 15 10)"/>
      <path d="M 8 10 Q 15 9 22 10" stroke="#FDE68A" stroke-width="1.2" fill="none"/>
    </g>
    <g transform="translate(190, 245)">
      <ellipse cx="12" cy="8" rx="8" ry="5.5" fill="url(#beanGrad)" transform="rotate(5 12 8)"/>
      <path d="M 6 8 Q 12 9 18 8" stroke="#FDE68A" stroke-width="1" fill="none"/>
    </g>
  </g>
  <text x="200" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#78350F" text-anchor="middle" letter-spacing="1">100% SINGLE ORIGIN • ETHICALLY SOURCED • FRESH ROAST</text>
</svg>
