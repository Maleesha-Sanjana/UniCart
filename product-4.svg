<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="HyperCharge 65W GaN Fast Dual-Port Charger">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF3C7"/>
      <stop offset="100%" stop-color="#FDE68A"/>
    </linearGradient>
    <linearGradient id="chargerBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="metalPins" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
    <filter id="shadow4" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="6" dy="12" stdDeviation="10" flood-color="#78350F" flood-opacity="0.18"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg4)"/>
  <!-- Energy Spark Decor -->
  <path d="M 120 60 L 140 100 L 125 105 L 145 150" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  <path d="M 280 180 L 295 210 L 285 215 L 305 250" fill="none" stroke="#F59E0B" stroke-width="2" opacity="0.4"/>
  <!-- Charger Unit -->
  <g filter="url(#shadow4)" transform="translate(110, 70)">
    <!-- AC Pins Folded / Extended -->
    <rect x="-35" y="45" width="40" height="10" rx="2" fill="url(#metalPins)"/>
    <rect x="-35" y="85" width="40" height="10" rx="2" fill="url(#metalPins)"/>
    <circle cx="-25" cy="50" r="2.5" fill="#475569"/>
    <circle cx="-25" cy="90" r="2.5" fill="#475569"/>
    <!-- Main Cube Brick -->
    <rect x="0" y="10" width="160" height="125" rx="18" fill="url(#chargerBody)" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Front Face (Port area) -->
    <rect x="120" y="15" width="35" height="115" rx="10" fill="#0F172A"/>
    <!-- Type-C Port 1 -->
    <rect x="128" y="32" width="18" height="8" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
    <text x="115" y="39" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748B" text-anchor="end">PD 65W</text>
    <!-- Type-C Port 2 -->
    <rect x="128" y="58" width="18" height="8" rx="4" fill="#38BDF8" stroke="#0284C7" stroke-width="1"/>
    <text x="115" y="65" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748B" text-anchor="end">PD 30W</text>
    <!-- USB-A Port 3 -->
    <rect x="127" y="85" width="20" height="12" rx="2" fill="#F59E0B"/>
    <rect x="130" y="87" width="14" height="4" fill="#0F172A"/>
    <text x="115" y="94" font-family="system-ui, sans-serif" font-size="8" font-weight="700" fill="#64748B" text-anchor="end">QC 3.0</text>
    <!-- LED Glow -->
    <circle cx="137" cy="112" r="3" fill="#10B981"/>
    <!-- 65W GaN Typography on side -->
    <text x="45" y="65" font-family="system-ui, sans-serif" font-weight="900" font-size="28" fill="#1E293B">65W</text>
    <text x="45" y="85" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#F59E0B" letter-spacing="2">GaN FAST</text>
    <!-- Lightning Bolt Icon -->
    <path d="M 22 50 L 32 30 L 28 50 L 38 48 L 22 80 L 26 58 Z" fill="#F59E0B"/>
  </g>
  <text x="200" y="278" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#B45309" text-anchor="middle" letter-spacing="1">GALLIUM NITRIDE • DUAL USB-C + USB-A • LAPTOP READY</text>
</svg>
