<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="100%" height="100%" role="img" aria-label="Wild Mountain Blossom Raw Organic Honey">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="honeyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="glassReflection" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6"/>
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.1"/>
      <stop offset="80%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3"/>
    </linearGradient>
    <filter id="shadow9" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="10" flood-color="#78350F" flood-opacity="0.25"/>
    </filter>
  </defs>
  <rect width="400" height="320" rx="20" fill="url(#bg9)"/>
  <!-- Honeycomb decorative background pattern -->
  <polygon points="60,60 80,50 100,60 100,80 80,90 60,80" fill="none" stroke="#FDE68A" stroke-width="2"/>
  <polygon points="100,60 120,50 140,60 140,80 120,90 100,80" fill="none" stroke="#FDE68A" stroke-width="2"/>
  <polygon points="300,200 320,190 340,200 340,220 320,230 300,220" fill="none" stroke="#FDE68A" stroke-width="2"/>
  <polygon points="260,200 280,190 300,200 300,220 280,230 260,220" fill="none" stroke="#FDE68A" stroke-width="2"/>
  <!-- Honey Jar & Dipper -->
  <g filter="url(#shadow9)">
    <!-- Wooden Jar Lid -->
    <ellipse cx="200" cy="80" rx="46" ry="12" fill="#B45309" stroke="#78350F" stroke-width="2"/>
    <rect x="156" y="80" width="88" height="15" fill="#92400E"/>
    <ellipse cx="200" cy="95" rx="44" ry="8" fill="#78350F"/>
    <!-- Glass Jar Body -->
    <path d="M 158 95 
             C 140 105, 130 140, 130 190 
             C 130 235, 150 248, 200 248 
             C 250 248, 270 235, 270 190 
             C 270 140, 260 105, 242 95 Z" 
          fill="url(#honeyGrad)" stroke="#D97706" stroke-width="2"/>
    <!-- Glass Light Reflection -->
    <path d="M 142 120 C 138 150, 138 190, 148 230 C 145 220, 142 160, 150 125 Z" fill="url(#glassReflection)"/>
    <!-- Label -->
    <rect x="150" y="140" width="100" height="70" rx="6" fill="#FFFDF5" stroke="#B45309" stroke-width="1.5"/>
    <text x="200" y="158" font-family="serif" font-weight="700" font-size="11" fill="#78350F" text-anchor="middle" letter-spacing="0.5">WILD MOUNTAIN</text>
    <text x="200" y="174" font-family="system-ui, sans-serif" font-weight="900" font-size="14" fill="#B45309" text-anchor="middle">RAW HONEY</text>
    <line x1="165" y1="180" x2="235" y2="180" stroke="#F59E0B" stroke-width="1"/>
    <text x="200" y="194" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#059669" text-anchor="middle">100% PURE &amp; UNPASTEURIZED</text>
    <text x="200" y="204" font-family="system-ui, sans-serif" font-weight="700" font-size="8" fill="#78350F" text-anchor="middle">500g</text>
    <!-- Honey Dipper Stick -->
    <g transform="translate(255, 65) rotate(28)">
      <rect x="0" y="0" width="10" height="150" rx="4" fill="#D97706" stroke="#92400E" stroke-width="1"/>
      <ellipse cx="5" cy="140" rx="14" ry="7" fill="#B45309"/>
      <ellipse cx="5" cy="130" rx="16" ry="8" fill="#B45309"/>
      <ellipse cx="5" cy="120" rx="18" ry="9" fill="#B45309"/>
      <ellipse cx="5" cy="110" rx="15" ry="7" fill="#B45309"/>
      <!-- Honey drip drop -->
      <path d="M 5 147 Q 8 165 5 170 Q 2 165 5 147 Z" fill="#F59E0B" stroke="#D97706" stroke-width="1"/>
    </g>
  </g>
  <text x="200" y="295" font-family="system-ui, sans-serif" font-size="11" font-weight="700" fill="#92400E" text-anchor="middle" letter-spacing="1">RAW &amp; UNFILTERED • NATURAL ENZYMES • ARTISAN HARVEST</text>
</svg>
